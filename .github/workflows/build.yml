# Builds pages, PDFs, archive, sitemap and RSS from content/articles/*.md, commits the
# generated files, and deploys the site to GitHub Pages. Runs on every push to main
# (for example when a "Daily articles" pull request is merged) and on demand.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate articles
        run: python3 tools/build_site.py --check

      - name: Build site (pages, PDFs, archive, sitemap, RSS)
        run: python3 tools/build_site.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles downloads images/cards images/og publications 404.html index.html sitemap.xml feed.xml
          [ -d whitepapers ] && git add -A whitepapers || true
          if ! git diff --cached --quiet; then
            git commit -m "Build site from content"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Tell Bing, Yahoo and others about new pages (IndexNow)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          body = json.dumps({"host": "kamleshbhagatkar.com", "key": "2a5a5ce3ba5f73facb608884c626474d",
                              "keyLocation": "https://kamleshbhagatkar.com/2a5a5ce3ba5f73facb608884c626474d.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "URLs")
          except Exception as e:
              print("IndexNow failed (site is still live):", e)
          PY

      # After deploy, so every link is live. Each platform is skipped until its secrets are set.
      - name: Post new articles to Telegram and Blogger
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          status=0; python3 tools/syndicate.py || status=$?
          git add content/syndicated.json
          if ! git diff --cached --quiet; then   # record what was posted even if one platform failed
            git commit -m "Record syndicated articles"
            git push
          fi
          exit $status
