# Builds pages, PDFs, archive, sitemap and RSS from content/articles/*.md, commits the
# generated files, and deploys the site to GitHub Pages. Runs on every push to main
# (for example when a "Daily articles" pull request is merged) and on demand.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate articles
        run: python3 tools/build_site.py --check

      - name: Build site (pages, PDFs, archive, sitemap, RSS)
        run: python3 tools/build_site.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A about articles downloads images/cards images/og images/social publications 404.html index.html sitemap.xml feed.xml
          [ -d whitepapers ] && git add -A whitepapers || true
          [ -d books ] && git add -A books || true
          if ! git diff --cached --quiet; then
            git commit -m "Build site from content"
            git push
          fi

      # Serve only the website: repo notes, build scripts and article sources stay off the domain.
      - name: Copy website files to _site
        run: |
          rsync -a --exclude=.git/ --exclude=.github/ --exclude=.gitignore --exclude=CLAUDE.md \
            --exclude=tools/ --exclude=content/ --exclude=_site/ --exclude=__pycache__/ ./ _site/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Tell Bing, Yahoo and others about new pages (IndexNow)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          body = json.dumps({"host": "kamleshbhagatkar.com", "key": "2a5a5ce3ba5f73facb608884c626474d",
                              "keyLocation": "https://kamleshbhagatkar.com/2a5a5ce3ba5f73facb608884c626474d.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "URLs")
          except Exception as e:
              print("IndexNow failed (site is still live):", e)
          PY

      # After deploy, so every link is live. Each platform is skipped until its secrets are set.
      - name: Post new articles to every connected site (Zenodo whitepapers as drafts)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          TUMBLR_BLOG: ${{ secrets.TUMBLR_BLOG }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN: ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
          WPCOM_SITE: ${{ secrets.WPCOM_SITE }}
          WPCOM_TOKEN: ${{ secrets.WPCOM_TOKEN }}
          WRITEAS_COLLECTION: ${{ secrets.WRITEAS_COLLECTION }}
          WRITEAS_TOKEN: ${{ secrets.WRITEAS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          SYNDICATION_PAUSED: ${{ vars.SYNDICATION_PAUSED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0; python3 tools/syndicate.py > syndicate.log 2>&1 || status=$?; cat syndicate.log  # no pipe, so a failure is not hidden
          grep '^ZENODO_DRAFT ' syndicate.log | while read -r _ slug url; do   # a DOI is permanent: he reviews and publishes by hand
            gh issue create --title "Zenodo draft ready: $slug" --body "A draft for the whitepaper **$slug** is on Zenodo: $url

          Check the title, licence and abstract, then click **Publish** to get the DOI. After that, add the DOI to content/whitepapers/$slug.md as doi: 10.5281/zenodo.NNN" || true
          done
          git add content/syndicated.json
          if ! git diff --cached --quiet; then   # record what was posted even if one platform failed
            git commit -m "Record syndicated articles"
            git push
          fi
          exit $status
